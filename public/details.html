<html>

<head>
    <title>Pet Adoption Site</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/view-resources.js"></script>
    <script src="js/animal-details.js"></script>
    <script src="js/update-animal-breed.js"></script>
    <script src="js/edit-resource.js"></script>
    <script>
        // Get the ID from the URL
        var params = new URLSearchParams(window.location.search);
        var animalId = params.get('id');

        console.log("Animal ID:", animalId);
    </script>
</head>

<body style="color: white;" onload="viewAnimalDetails()">
    <section class="hero-details">
        <div class="heroContent">
            <img class="logo" src="images/dummy.jpg">
            <h2>Site Name | Home</h2>
        </div>
    </section>

    <a href="index.html">
        <button class="back">
            <p>← back to listings</p>
        </button>
    </a>
    <div class="entireData" id="entireData">
        <div class="animalTags-details">
            <div>
                <p>gender</p>
            </div>
            <div>
                <p>age</p>
            </div>
            <div>
                <p>breed</p>
            </div>
        </div>

        <h1 class="animalName">Bob</h1>
        <hr style="width: 90%; margin: 20px auto;">

        <div class="animalDetails" id='animalDetails'>
            <div class="animalImage">
                <img src="images/dummy.jpg">
            </div>
            <div class="animalDescription">
                <h2>About Bob</h2>
                <p>Bob is a friendly and playful dog who loves to go on walks and play fetch. He is house-trained and
                    does
                    well with other pets.</p>
                <button class="adoptButton">
                    <p>Adopt Bob</p>
                </button>
            </div>

        </div>
    </div>

    <!-- swapped from opening overlay through html, to opening overlay through JavaScript -->
    <a href="" class="editbtn" onclick="editResource(); return false;">
        <p class="crudicon">🖍</p>
    </a>

    <a href="" class="deletebtn">
        <p class="crudicon">
            🗑
        </p>
    </a>


    <!-- Edit Animal Popup -->
    <div class="Popup" id="Popup">
        <div class="PopupContent">
            <h2>Edit Animal Details</h2>

            <label for="name">Animal Name</label>
            <input type="text" id="name" placeholder="Animal name">

            <label>Image URL</label>
            <input type="text" id="image" placeholder="e.g. images/dummy.jpg">

            <div class="PopupRow">
                <div>
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div>
                    <label for="age">Age</label>
                    <select id="age">
                        <option value="adult">Adult</option>
                        <option value="teen">Teen</option>
                        <option value="child">Child</option>
                    </select>
                </div>
            </div>

            <div class="PopupRow">
                <div>
                    <label for="species">Species</label>
                    <select id="editSpecies" name="species" onchange="updateBreeds('editSpecies', 'editBreed')" required>
                        <option value="dog">Dog</option>
                        <option value="cat">Cat</option>
                        <option value="rabbit">Rabbit</option>
                    </select>
                </div>
                <div>
                    <label>Breed</label>
                    <select id="editBreed" name="breed" required>
                    </select>
                </div>

            </div>

            <label for="status">Status</label>
            <select id="status">
                <option value="available">Available</option>
                <option value="adopted">Adopted</option>
                <option value="reserved">Reserved</option>
            </select>

            <label for="description">Description</label>
            <textarea placeholder="Animal description" id="description"></textarea>

            <div class="PopupButtons">
                <button onclick="document.getElementById('Popup').style.display='none'">Cancel</button>
                <button id="updateButton">Save Changes</button>
            </div>
        </div>
    </div>
</body>

</html>
