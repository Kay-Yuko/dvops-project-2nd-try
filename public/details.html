<html>

<head>
    <title>Pet Adoption Site</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/view-resources.js"></script>
    <script src="js/animal-Details.js"></script>
    <script>
        // Get the ID from the URL
        var params = new URLSearchParams(window.location.search);
        var animalId = params.get('id');

        console.log("Animal ID:", animalId);
    </script>
</head>

<body style="color: white;" onload="viewAnimalDetails()">
    <section class="hero-details">
        <div class="heroContent">
            <img class="logo" src="images/dummy.jpg">
            <h2>Site Name | Home</h2>
        </div>
    </section>

    <a href="index.html">
        <button class="back">
            <p>← back to listings</p>
        </button>
    </a>
    <div class="entireData" id="entireData">
        <div class="animalTags-details">
            <div>
                <p>gender</p>
            </div>
            <div>
                <p>age</p>
            </div>
            <div>
                <p>breed</p>
            </div>
        </div>

        <h1 class="animalName">Bob</h1>
        <hr style="width: 90%; margin: 20px auto;">

        <div class="animalDetails" id='animalDetails'>
            <div class="animalImage">
                <img src="images/dummy.jpg">
            </div>
            <div class="animalDescription">
                <h2>About Bob</h2>
                <p>Bob is a friendly and playful dog who loves to go on walks and play fetch. He is house-trained and
                    does
                    well with other pets.</p>
                <button class="adoptButton">
                    <p>Adopt Bob</p>
                </button>
            </div>

        </div>
    </div>
    <a href="" class="editbtn" onclick="document.getElementById('Popup').style.display='flex'; return false;">
        <p class="crudicon">🖍</p>
    </a>

    <a href="" class="deletebtn">
        <p class="crudicon">
            🗑
        </p>
    </a>


    <!-- Edit Animal Popup -->
    <div class="Popup" id="Popup">
        <div class="PopupContent">
            <h2>Edit Animal Details</h2>

            <label>Animal Name</label>
            <input type="text" placeholder="Animal name">

            <label>Image URL</label>
            <input type="text" placeholder="e.g. images/dummy.jpg">

            <div class="PopupRow">
                <div>
                    <label>Gender</label>
                    <select>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div>
                    <label>Age</label>
                    <select>
                        <option>Adult</option>
                        <option>Teen</option>
                        <option>Child</option>
                    </select>
                </div>
            </div>

            <div class="PopupRow">
                <div>
                    <label>Status</label>
                    <select>
                        <option>Available</option>
                        <option>Adopted</option>
                        <option>Reserved</option>
                    </select>
                </div>

                <div>
                    <label>Species</label>
                    <select>
                        <option>Select Species</option>
                    </select>
                </div>
            </div>

            <label>Breed</label>
            <input type="text" placeholder="Animal breed">

            <label>Description</label>
            <textarea placeholder="Animal description"></textarea>

            <div class="PopupButtons">
                <button onclick="document.getElementById('Popup').style.display='none'">Cancel</button>
                <button>Save Changes</button>
            </div>
        </div>
    </div>
</body>

</html>
