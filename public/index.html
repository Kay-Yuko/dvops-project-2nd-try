<html>

<head>
    <title>Pet Adoption Site</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src='./js/animals.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/view-resources.js"></script>
</head>

<body onload="viewResources()">

    <section class="hero">
        <div class="heroContent">
            <img class="logo" src="images/dummy.jpg">
            <h2>Site Name | Home</h2>
        </div>
    </section>

    <div class="filterArea">
        <div class="filterContent">
            <div class="filterAnimals">

                <label for="name">search by name</label>
                <input type="text" id="name" placeholder="name" name="name">

                <div class="filterDropDown">

                    <div class="dropDown">
                        <label for="gender">gender</label>
                        <select name="gender" id="gender">
                            <option value="any">Any</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="dropDown">
                        <label for="age">age</label>
                        <select name="age" id="age">
                            <option value="any">Any</option>
                            <option value="adult">Adult</option>
                            <option value="teen">Teen</option>
                            <option value="child">Child</option>
                        </select>
                    </div>

                    <div class="dropDown">
                        <label for="species">species</label>
                        <select name="species" id="species">
                            <option value="any">Any</option>
                            <option value="dog">Dog</option>
                            <option value="cat">Cat</option>
                            <option value="rabbit">Rabbit</option>
                        </select>
                    </div>

                    <div class="dropDown">
                        <label for="breed">breed</label>
                        <select name="breed" id="breed">
                            <option value="breed1">breed1</option>
                            <option value="breed2">breed2</option>
                            <option value="breed3">breed3</option>
                            <option value="breed4">breed4</option>
                        </select>
                    </div>
                </div>
            </div>

            <button class="clear">
                <p>clear</p>
            </button>

        </div>
    </div>

    <div class="animalList" id ='animalList'>

        <div class="animal">
            <div class="petImage">
                <div class="petStatus">Available</div>
            </div>

            <div class="animalInfo">
                <p>Name</p>

                <div class="animalTags">
                    <div>
                        <p>gender</p>
                    </div>
                    <div>
                        <p>age</p>
                    </div>
                    <div>
                        <p>breed</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="animal">
            <div class="petImage">
                <div class="petStatus">Available</div>
            </div>

            <div class="animalInfo">
                <p>Name</p>

                <div class="animalTags">
                    <div>
                        <p>gender</p>
                    </div>
                    <div>
                        <p>age</p>
                    </div>
                    <div>
                        <p>breed</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="animal">
            <div class="petImage">
                <div class="petStatus">Available</div>
            </div>

            <div class="animalInfo">
                <p>Name</p>

                <div class="animalTags">
                    <div>
                        <p>gender</p>
                    </div>
                    <div>
                        <p>age</p>
                    </div>
                    <div>
                        <p>breed</p>
                    </div>
                </div>
            </div>
        </div>

        
    </div>

    <a href="" class="addbtn">
        <p class="plusicon">
            +
        </p>
    </a>




</body>

</html>
